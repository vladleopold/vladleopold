<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GracePlanner</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101827;color:#eef4ff;font:16px system-ui}header{padding:22px;background:#1b2d45}main{display:grid;grid-template-columns:280px 1fr;gap:16px;padding:16px}section,aside{padding:16px;background:#1a2a41;border:1px solid #354b63;border-radius:12px}label{display:block;margin:10px 0}input,textarea{display:block;width:100%;padding:9px;background:#0d1a2a;color:white;border:1px solid #49617b;border-radius:7px}button{padding:10px;background:#5dd0c8;border:0;border-radius:7px;font-weight:bold;cursor:pointer}.doc{padding:12px;margin:8px 0;background:#253a53;border-radius:8px}canvas{width:100%;background:#0b1523}.muted{color:#aec0d3;font-size:13px}@media(max-width:800px){main{grid-template-columns:1fr}}
</style></head><body><header><h1>GracePlanner</h1><div class="muted">3D-концепція приміщень і генератор п’яти документів</div></header><main><aside><h2>Параметри</h2><label>Назва проєкту<input id="name" value="GracePlanner — план безпеки"></label><label>Поверхів<input id="floors" type="number" min="1" max="12" value="4"></label><label>Кімнат на поверсі<input id="rooms" type="number" min="1" max="20" value="6"></label><label>Ширина, м<input id="width" type="number" value="24"></label><label>Глибина, м<input id="depth" type="number" value="16"></label><label>Камер на поверсі<input id="cams" type="number" value="8"></label><label>Примітки<textarea id="notes">Фактичні фото й обміри необхідно перевірити на об’єкті.</textarea></label><button id="generate">Створити документи</button><p id="status" class="muted">Документи створюються у браузері. AI/API ще не підключений.</p></aside><div><section><h2>3D-схема поверхів</h2><canvas id="model" width="900" height="420"></canvas><p class="muted">Концептуальна схема, не затверджена BIM-модель за фактичними обмірами.</p></section><section><h2>П’ять документів</h2><div id="docs"></div></section></div></main><script>
const titles=['Технічне завдання','Реєстр приміщень і фотоджерел','3D/BIM та правила побудови','Відеонагляд та інженерна безпека','Перевірки й звіт'];let bodies=[];const $=id=>document.getElementById(id);
function build(){let p={name:$('name').value,floors:$('floors').value,rooms:$('rooms').value,width:$('width').value,depth:$('depth').value,cameras:$('cams').value,notes:$('notes').value};let c='Проєкт: '+p.name+'\nПараметри концепції: '+p.floors+' поверхів; '+p.rooms+' кімнат/поверх; габарити '+p.width+'×'+p.depth+' м; камер '+p.cameras+' на поверх.\nПримітки: '+p.notes+'\n\nЗастереження: фактичні фото, обміри та специфікації не надані. Перевірити перед використанням.';bodies=[c+'\n\nМета: цифрова концепція приміщень і початковий план безпеки. Потрібні плани поверхів, фото, обміри, двері/вікна та вимоги замовника.',c+'\n\nПоля: ID, поверх, назва, розміри, матеріали, двері/вікна, ID фото, джерело вимірювання, дата, рівень достовірності. Невідомі значення позначати «потрібен обмір».',c+'\n\nСтіни, перекриття, отвори, меблі, камери й кабельні траси — окремі об’єкти з ID і джерелом. Геометрія демонстраційна; для BIM/IFC потрібні точні плани й перевірка.',c+'\n\nПередбачити IP-камери, PoE-комутатори, NVR/NAS, сегментацію мережі та резервне живлення. Не розраховані кути огляду, бітрейт, строк зберігання, PoE-бюджет і кабельні довжини.',c+'\n\nПеревірити ID, прив’язку фото, покриття камер, канали NVR, кабельні траси, живлення, зберігання та кошторис. Ціни й інженерні показники не підтверджені.'];$('docs').innerHTML=titles.map((t,i)=>'<div class="doc"><b>'+t+'</b><p><button onclick="downloadDoc('+i+')">Завантажити HTML</button></p></div>').join('');$('status').textContent='П’ять документів сформовано. Кожен доступний для завантаження.';draw()}
function draw(){let x=$('model').getContext('2d'),f=Math.min(12,Math.max(1,+$('floors').value||1)),r=Math.min(20,Math.max(1,+$('rooms').value||1));x.clearRect(0,0,900,420);x.strokeStyle='#86bfd5';x.lineWidth=2;for(let k=0;k<f;k++){let y=370-k*42;x.beginPath();x.moveTo(180,y-35);x.lineTo(450,y-100);x.lineTo(720,y-35);x.lineTo(450,y+35);x.closePath();x.stroke();x.beginPath();x.moveTo(180,y-35);x.lineTo(180,y-75);x.lineTo(450,y-140);x.lineTo(450,y-100);x.stroke();x.beginPath();x.moveTo(720,y-35);x.lineTo(720,y-75);x.lineTo(450,y-140);x.stroke();for(let j=1;j<r;j++){let xx=180+j*540/r;x.beginPath();x.moveTo(xx,y-35);x.lineTo(xx,y-75);x.stroke()}}x.fillStyle='#d2e4f4';x.font='16px system-ui';x.fillText(f+' поверхів · '+r+' кімнат/поверх',18,25)}
function downloadDoc(i){let esc=bodies[i].replace(/&/g,'&amp;').replace(/</g,'&lt;'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['<!doctype html><meta charset="utf-8"><h1>'+titles[i]+'</h1><pre style="white-space:pre-wrap;font:16px Arial">'+esc+'</pre>'],{type:'text/html'}));a.download='GracePlanner_'+(i+1)+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
$('generate').onclick=build;['floors','rooms','width','depth','cams'].forEach(id=>$(id).addEventListener('input',draw));build();
</script></body></html>
